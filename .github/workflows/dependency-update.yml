name: Dependency Update Check

on:
  schedule:
    # Run weekly on Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for outdated packages
        id: outdated
        run: |
          OUTDATED=$(npm outdated --json || true)
          echo "OUTDATED<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTDATED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create issue if updates available
        if: steps.outdated.outputs.OUTDATED != '{}'
        uses: actions/github-script@v7
        with:
          script: |
            const outdated = JSON.parse('${{ steps.outdated.outputs.OUTDATED }}');
            const packages = Object.entries(outdated);

            if (packages.length === 0) return;

            const body = `## 📦 Dependency Updates Available

            The following packages have updates available:

            | Package | Current | Wanted | Latest |
            |---------|---------|--------|--------|
            ${packages.map(([name, info]) => `| ${name} | ${info.current} | ${info.wanted} | ${info.latest} |`).join('\n')}

            Run \`npm update\` to update to wanted versions, or \`npm install <package>@latest\` for major updates.

            > 🤖 This issue was created automatically by GitHub Actions.`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['dependencies']
            });

            const existingIssue = issues.data.find(issue =>
              issue.title === '📦 Dependency Updates Available'
            );

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 Dependency Updates Available',
                body: body,
                labels: ['dependencies']
              });
            }
